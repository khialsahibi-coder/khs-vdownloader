name: Build KHS VDownloader APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libgles2-mesa-dev libgbm-dev libdrm-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxdamage-dev \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libudev-dev libwayland-dev libxkbcommon-dev \
            freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Set up Android SDK
        run: |
          mkdir -p $HOME/.android
          echo "count=0" > $HOME/.android/repositories.cfg
          echo "### User Sources for Android SDK Manager" >> $HOME/.android/repositories.cfg

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          ANDROID_NDK_HOME: /usr/lib/android-sdk/ndk/25.2.9519653
        run: |
          buildozer -v android debug

      - name: Rename APK
        run: |
          if [ -f bin/*.apk ]; then
            cp bin/*.apk bin/KHS-VDownloader-debug.apk
            echo "APK built successfully"
            ls -la bin/
          else
            echo "No APK found in bin/"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHS-VDownloader-APK
          path: bin/KHS-VDownloader-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/KHS-VDownloader-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release build job (triggered manually or on tag)
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Build Release APK
        env:
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          ANDROID_NDK_HOME: /usr/lib/android-sdk/ndk/25.2.9519653
        run: |
          buildozer -v android release

      - name: Rename Release APK
        run: |
          if [ -f bin/*.apk ]; then
            cp bin/*.apk bin/KHS-VDownloader-release.apk
            echo "Release APK built successfully"
            ls -la bin/
          else
            echo "No APK found in bin/"
            exit 1
          fi

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHS-VDownloader-Release-APK
          path: bin/KHS-VDownloader-release.apk
          retention-days: 30
