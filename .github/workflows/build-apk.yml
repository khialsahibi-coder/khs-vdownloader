name: Build KHS VDownloader APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (REQUIRED for buildozer)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Don't cache pip - no requirements.txt in this project
          cache: ''

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libgles2-mesa-dev libgbm-dev libdrm-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxdamage-dev \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libudev-dev libwayland-dev libxkbcommon-dev \
            freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Install ncurses legacy libs (Ubuntu 26.04+)
        run: |
          sudo apt-get install -y libtinfo6 2>/dev/null || sudo apt-get install -y libncurses-dev 2>/dev/null || true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install buildozer with pinned dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          # CRITICAL: cython 0.29.36 - newer versions break buildozer
          pip install cython==0.29.36
          pip install buildozer

      - name: Verify project structure
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo "=== Main Python ==="
          cat main.py
          echo "=== Java sources ==="
          find app/src/main/java -name "*.java" | head -20

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          ANDROID_NDK_HOME: /usr/lib/android-sdk/ndk/25.2.9519653
        run: |
          buildozer -v android debug

      - name: Rename APK
        run: |
          if [ -f bin/*.apk ]; then
            cp bin/*.apk bin/KHS-VDownloader-debug.apk
            echo "APK built successfully"
            ls -la bin/
          else
            echo "No APK found in bin/"
            echo "=== Buildozer log ==="
            cat .buildozer/android/platform/build-*/dists/*/gradle/build/outputs/apk/debug/*.apk 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHS-VDownloader-APK
          path: bin/KHS-VDownloader-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/KHS-VDownloader-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: ''

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install buildozer with pinned dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36
          pip install buildozer

      - name: Build Release APK
        env:
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          ANDROID_NDK_HOME: /usr/lib/android-sdk/ndk/25.2.9519653
        run: |
          buildozer -v android release

      - name: Rename Release APK
        run: |
          if [ -f bin/*.apk ]; then
            cp bin/*.apk bin/KHS-VDownloader-release.apk
            echo "Release APK built successfully"
            ls -la bin/
          else
            echo "No APK found in bin/"
            exit 1
          fi

      - name: Upload Release APK artifact
        uses: actions/upload_artifact@v4
        with:
          name: KHS-VDownloader-Release-APK
          path: bin/KHS-VDownloader-release.apk
          retention-days: 30
