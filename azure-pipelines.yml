# Azure Pipelines for KHS VDownloader Android APK Build
# Fixes applied: Android SDK license acceptance + Ubuntu 26.04 package compatibility

trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-26.04'

variables:
  # Android SDK configuration
  ANDROID_SDK_ROOT: '/usr/lib/android-sdk'
  ANDROID_NDK_HOME: '/usr/lib/android-sdk/ndk/25.2.9519653'

steps:
# ---------- 1. Checkout ----------
- task: AzureCLI@1
  displayName: 'Checkout repository'
  inputs:
    azureSubscription: ''
    scriptType: 'ps'
    scriptPath: 'scripts/checkout.ps1'
    overrideWorkDir: true

# ---------- 2. Install System Dependencies ----------
- task: Bash@3
  displayName: 'Install system dependencies'
  inputs:
    targetType: 'inline'
    script: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
        pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
        cmake libffi-dev libssl-dev \
        libgles2-mesa-dev libgbm-dev libdrm-dev \
        libx11-dev libxext-dev libxfixes-dev libxi-dev \
        libxrender-dev libxrandr-dev libxinerama-dev \
        libxcursor-dev libxcomposite-dev libxdamage-dev \
        libasound2-dev libpulse-dev libdbus-1-dev \
        libudev-dev libwayland-dev libxkbcommon-dev \
        freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev

# ---------- 3. Accept Android SDK Licenses (FIX for "Aidl not found") ----------
- bash: yes | sdkmanager --licenses
  displayName: 'Accept Android SDK licenses'
  env:
    ANDROID_SDK_ROOT: '/usr/lib/android-sdk'

# ---------- 4. Install ncurses legacy libs (FIX for Ubuntu 26.04 libtinfo5) ----------
- bash: |
    sudo apt-get install -y libtinfo6 2>/dev/null || \
    sudo apt-get install -y libncurses-dev 2>/dev/null || true
  displayName: 'Install ncurses legacy libs (Ubuntu 26.04+)'

# ---------- 5. Install buildozer with pinned dependencies ----------
- bash: |
    pip install --upgrade pip setuptools wheel
    # CRITICAL: cython 0.29.36 - newer versions break buildozer
    pip install cython==0.29.36
    pip install buildozer
  displayName: 'Install buildozer with pinned dependencies'

# ---------- 6. Build APK ----------
- bash: buildozer -v android debug
  displayName: 'Build Android APK'
  env:
    ANDROID_SDK_ROOT: '/usr/lib/android-sdk'
    ANDROID_NDK_HOME: '/usr/lib/android-sdk/ndk/25.2.9519653'

# ---------- 7. Rename APK ----------
- bash: |
    if [ -f bin/*.apk ]; then
      cp bin/*.apk bin/KHS-VDownloader-debug.apk
      echo "APK built successfully"
      ls -la bin/
    else
      echo "No APK found in bin/"
      exit 1
    fi
  displayName: 'Rename APK'

# ---------- 8. Upload APK artifact ----------
- task: PublishBuildArtifacts@1
  displayName: 'Upload APK artifact'
  inputs:
    PathtoPublish: 'bin/KHS-VDownloader-debug.apk'
    ArtifactName: 'KHS-VDownloader-APK'
    retainCompressionState: false